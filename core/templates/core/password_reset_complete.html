{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        rel="icon"
        href="{% static 'img/logos/logo2.png' %}"
    >

    <title>Contraseña actualizada | Lúmina</title>

    <link rel="stylesheet" href="{% static 'css/base.css' %}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #fff5f8 0%, #ffe8ef 50%, #ffeef5 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 48px 36px;
            border-radius: 24px;
            box-shadow:
                0 20px 50px rgba(255, 79, 135, 0.12),
                0 4px 12px rgba(0, 0, 0, 0.04);
            text-align: center;
            animation: fadeUp 0.5s ease-out;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-wrap {
            width: 76px;
            height: 76px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff9ebe, #ff4f87);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(255, 79, 135, 0.35);
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.6);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .icon-wrap svg {
            width: 34px;
            height: 34px;
        }

        .logo {
            color: #ff4f87;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        h1 {
            color: #26262b;
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 12px;
        }

        p {
            color: #8a8a94;
            font-size: 15px;
            line-height: 1.6;
            margin: 0 0 8px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            margin-top: 26px;
            padding: 15px 25px;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff6d9d, #ff4f87);
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 8px 18px rgba(255, 79, 135, 0.3);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(255, 79, 135, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        @media (max-width: 480px) {
            .container {
                padding: 36px 24px;
                border-radius: 18px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 13l4 4L19 7" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>

    <div class="logo">Lúmina</div>

    <h1>¡Contraseña actualizada!</h1>

    <p>
        Tu contraseña se cambió correctamente.<br>
        Ya puedes iniciar sesión con tu nueva contraseña.
    </p>

    <a href="{% url 'login' %}" class="btn">
        Iniciar sesión
    </a>

</div>

</body>
</html>
