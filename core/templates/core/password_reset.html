{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        rel="icon"
        href="{% static 'img/logos/logo2.png' %}"
    >
    <title>Recuperar contraseña | Lúmina</title>

    <link rel="stylesheet" href="{% static 'css/base.css' %}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #fff5f8 0%, #ffe8ef 50%, #ffeef5 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        }

        .password-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 44px 36px;
            border-radius: 24px;
            box-shadow:
                0 20px 50px rgba(255, 79, 135, 0.12),
                0 4px 12px rgba(0, 0, 0, 0.04);
            text-align: center;
            animation: fadeUp 0.5s ease-out;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-wrap {
            width: 68px;
            height: 68px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff9ebe, #ff4f87);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(255, 79, 135, 0.35);
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.6);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .icon-wrap svg {
            width: 30px;
            height: 30px;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ff4f87;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 10px;
            color: #26262b;
            font-size: 24px;
            font-weight: 700;
        }

        .description {
            color: #8a8a94;
            font-size: 14.5px;
            line-height: 1.6;
            margin: 0 0 28px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="email"] {
            width: 100%;
            padding: 13px 15px;
            border: 1.5px solid #ececf0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: #fafafb;
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        input[type="email"]:focus {
            border-color: #ff4f87;
            background: white;
        }

        .btn {
            width: 100%;
            margin-top: 8px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff6d9d, #ff4f87);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(255, 79, 135, 0.3);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(255, 79, 135, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .back-login {
            display: inline-block;
            margin-top: 22px;
            color: #ff4f87;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .password-container {
                padding: 36px 24px;
                border-radius: 18px;
            }
        }
    </style>
</head>

<body>

<div class="password-container">

    <div class="logo">Lúmina</div>

    <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M17 10V7a5 5 0 00-10 0v3M6 10h12a1 1 0 011 1v9a1 1 0 01-1 1H6a1 1 0 01-1-1v-9a1 1 0 011-1z"
                  stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>

    <h1>¿Olvidaste tu contraseña?</h1>

    <p class="description">
        No te preocupes 💗. Ingresa el correo electrónico asociado
        a tu cuenta y te enviaremos un enlace para crear una nueva contraseña.
    </p>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="id_email">Correo electrónico</label>

            <input
                type="email"
                name="email"
                id="id_email"
                placeholder="Ingresa tu correo"
                required
            >
        </div>

        <button type="submit" class="btn">
            Enviar enlace
        </button>
    </form>

    <a href="{% url 'login' %}" class="back-login">
        ← Volver al inicio de sesión
    </a>

</div>

</body>
</html>
